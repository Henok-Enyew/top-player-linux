# Flatpak manifest for Top Player.
#
# Local build (needs flatpak-builder and the Flathub remote):
#   flatpak install -y flathub org.kde.Sdk//6.11 org.kde.Platform//6.11
#   flatpak-builder --user --install --force-clean build-flatpak org.github.topplayer.yaml
#   flatpak run org.github.topplayer
#
# The release workflow builds this into a single-file .flatpak bundle.
app-id: org.github.topplayer
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: top-player
finish-args:
  - --share=ipc
  - --socket=wayland
  # X11 too (not only as a fallback), for X11 mode: the mini player can stay
  # above other apps only through XWayland.
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  # Network streams (http, rtsp, ...).
  - --share=network
  # mpv opens files by path and looks for subtitles next to the video.
  - --filesystem=host:ro
  # Downloads, cut clips and lyrics are saved in the home folder.
  - --filesystem=home
  # yt-dlp and ffmpeg run from the system (packaging/flatpak/host-tool).
  - --talk-name=org.freedesktop.Flatpak
  # Screenshots (Ctrl+E) are saved to ~/Pictures.
  - --filesystem=xdg-pictures
  # MPRIS, so the media keys and the desktop's media controls reach the player.
  - --own-name=org.mpris.MediaPlayer2.top_player
cleanup:
  - '*.a'
  - '*.la'
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - /share/doc

modules:
  # libmpv and the libraries it needs that the KDE runtime does not ship.
  # FFmpeg comes from the runtime. Sources hosted on freedesktop.org list
  # mirrors: its servers sometimes turn CI runners away (HTTP 418). Every
  # download is checked against the sha256, whichever server it came from.
  - name: libXpresent
    buildsystem: autotools
    sources:
      - type: archive
        url: https://xorg.freedesktop.org/archive/individual/lib/libXpresent-1.0.2.tar.xz
        mirror-urls:
          - https://www.x.org/releases/individual/lib/libXpresent-1.0.2.tar.xz
          - https://ftp.funet.fi/pub/X11/X.org/individual/lib/libXpresent-1.0.2.tar.xz
          - https://mirrors.kernel.org/slackware/slackware64-current/source/x/x11/src/lib/libXpresent-1.0.2.tar.xz
        sha256: 4e5b21b4812206a4b223013606ae31170502c1043038777a1ef8f70c09d37602

  - name: libass
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.gz
        sha256: caab4b993dd7be6187c55623b789ed75dddefea6e65938af134637c732fe094a

  - name: uchardet
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_STATIC=0
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
        mirror-urls:
          - https://deb.debian.org/debian/pool/main/u/uchardet/uchardet_0.0.8.orig.tar.xz
          - https://mirrors.kernel.org/slackware/slackware64-current/source/l/uchardet/uchardet-0.0.8.tar.xz
          - https://distfiles.alpinelinux.org/distfiles/edge/uchardet-0.0.8.tar.xz
        sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddemos=false
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        tag: v7.360.1
        commit: 719cc95244a1f1d648dd72459822e026e6530f22

  # mpv's YouTube support (its ytdl hook) is a Lua script.
  - name: luajit
    buildsystem: simple
    build-commands:
      - make -j${FLATPAK_BUILDER_N_JOBS} PREFIX=${FLATPAK_DEST}
      - make install PREFIX=${FLATPAK_DEST}
    cleanup:
      - /bin
      - /share/man
    sources:
      - type: git
        url: https://github.com/LuaJIT/LuaJIT.git
        # The version is read from the commit history.
        disable-shallow-clone: true
        commit: c6ffc141a8762b41703f9287d63d93622a13dd8f

  - name: libmpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=luajit
      - -Djavascript=disabled
      - -Dalsa=disabled
      - -Ddebug=false
      - -Dbuild-date=false
      - -Dmanpage-build=disabled
    cleanup:
      - /share/bash-completion
      - /share/fish
      - /share/zsh
      - /share/icons
      - /share/applications
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.41.0.tar.gz
        sha256: ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209

  # yt-dlp and ffmpeg: the system's own, run outside the sandbox.
  - name: host-tools
    buildsystem: simple
    build-commands:
      - install -Dm755 host-tool ${FLATPAK_DEST}/bin/yt-dlp
      - install -Dm755 host-tool ${FLATPAK_DEST}/bin/ffmpeg
    sources:
      - type: file
        path: packaging/flatpak/host-tool

  - name: top-player
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    post-install:
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/LICENSE
    sources:
      - type: dir
        path: .
        skip:
          - build
          - build-appimage
          - build-flatpak
          - dist
