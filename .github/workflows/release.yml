name: Release

on:
  push:
    tags:
      - 'v*'
  # Build the packages without publishing, to test packaging changes.
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/**'
      - 'org.github.topplayer.yaml'
      - '.github/workflows/release.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Read version
        run: |
          project_version=$(sed -nE 's/^ *VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            # The tag may carry a suffix (v0.2.0-rc1) but must match the
            # version compiled into the binary.
            if [[ "${version%%-*}" != "$project_version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match project VERSION $project_version in CMakeLists.txt"
              exit 1
            fi
          else
            version="${project_version}-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  appimage:
    name: AppImage
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qmake6 qt6-wayland libgl-dev libmpv-dev zlib1g-dev libxcb1-dev \
            desktop-file-utils file

      - name: Build AppImage
        env:
          VERSION: ${{ needs.version.outputs.version }}
          # Optional built-in OpenSubtitles.com key; users can always enter their own.
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: packaging/appimage/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  deb:
    name: ${{ matrix.name }} .deb
    needs: version
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Ubuntu 22.04, image: 'ubuntu:22.04', key: ubuntu-22.04 }
          - { name: Ubuntu 24.04, image: 'ubuntu:24.04', key: ubuntu-24.04 }
          - { name: Ubuntu 26.04, image: 'ubuntu:26.04', key: ubuntu-26.04 }
          - { name: Debian 13, image: 'debian:13', key: debian-13 }
    steps:
      - name: Install packaging tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates devscripts equivs

      - uses: actions/checkout@v4

      - name: Build .deb
        env:
          VERSION: ${{ needs.version.outputs.version }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          DEBIAN_FRONTEND: noninteractive
        run: packaging/debian/build-deb.sh

      - name: Install and start
        env:
          DEBIAN_FRONTEND: noninteractive
          QT_QPA_PLATFORM: offscreen
        run: |
          apt-get install -y ./dist/*.deb
          top-player --version

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.key }}
          path: dist/*.deb
          if-no-files-found: error

  rpm:
    name: ${{ matrix.name }} RPM
    needs: version
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fedora
            image: 'fedora:latest'
            key: fedora
            setup: dnf install -y git rpm-build rpmdevtools 'dnf-command(builddep)'
            install: dnf install -y ./dist/top-player-*.x86_64.rpm
            srpm: 1
          - name: openSUSE Tumbleweed
            image: 'opensuse/tumbleweed:latest'
            key: opensuse-tumbleweed
            setup: zypper --non-interactive install --no-recommends git rpm-build tar gzip
            install: zypper --non-interactive --no-gpg-checks install ./dist/top-player-*.x86_64.rpm
            srpm: 0
          - name: openSUSE Leap 16.0
            image: 'opensuse/leap:16.0'
            key: opensuse-leap-16.0
            setup: zypper --non-interactive install --no-recommends git rpm-build tar gzip
            install: zypper --non-interactive --no-gpg-checks install ./dist/top-player-*.x86_64.rpm
            srpm: 0
    steps:
      - name: Install packaging tools
        run: ${{ matrix.setup }}

      - uses: actions/checkout@v4

      - name: Build RPM
        env:
          VERSION: ${{ needs.version.outputs.version }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          INCLUDE_SRPM: ${{ matrix.srpm }}
        run: packaging/rpm/build-rpm.sh

      - name: Install and start
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ${{ matrix.install }}
          top-player --version

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.key }}
          path: dist/*.rpm
          if-no-files-found: error

  arch:
    name: Arch Linux package
    needs: version
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install packaging tools
        run: pacman -Syu --noconfirm --needed git base-devel sudo

      - uses: actions/checkout@v4

      - name: Build package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: packaging/arch/build-arch.sh

      - name: Install and start
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pacman -U --noconfirm dist/*.pkg.tar.zst
          top-player --version

      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  flatpak:
    name: Flatpak
    needs: version
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # flatpak-builder doesn't pass the environment on; CMake reads this file instead.
      - name: Add OpenSubtitles API key
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: |
          if [ -n "$OPENSUBTITLES_API_KEY" ]; then
            printf '%s\n' "$OPENSUBTITLES_API_KEY" > opensubtitles-api-key.txt
          fi

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: org.github.topplayer.yaml
          bundle: Top_Player-${{ needs.version.outputs.version }}-x86_64.flatpak
          upload-artifact: false
          cache-key: flatpak-builder-${{ hashFiles('org.github.topplayer.yaml') }}

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: Top_Player-*.flatpak
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, appimage, deb, rpm, arch, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          name: Top Player ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
