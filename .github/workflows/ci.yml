name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev libgl-dev libmpv-dev zlib1g-dev libxcb1-dev \
            ffmpeg xvfb xauth libgl1-mesa-dri

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTOPPLAYER_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a ctest --test-dir build --output-on-failure

  ubuntu-2204:
    # Oldest supported Qt (6.2) and libmpv: keeps the 22.04 .deb building.
    name: Ubuntu 22.04 (Qt 6.2)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev libqt6opengl6-dev libgl-dev libmpv-dev zlib1g-dev libxcb1-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTOPPLAYER_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

  fedora:
    name: Fedora (latest)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            gcc-c++ cmake ninja-build pkgconf-pkg-config \
            qt6-qtbase-devel mesa-libGL-devel 'pkgconfig(mpv)' zlib-devel libxcb-devel

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel
