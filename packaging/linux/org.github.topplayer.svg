<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="16" y1="16" x2="240" y2="240">
      <stop offset="0" stop-color="#242530"/>
      <stop offset="1" stop-color="#121319"/>
    </linearGradient>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="72" y1="64" x2="184" y2="192">
      <stop offset="0" stop-color="#f8c85e"/>
      <stop offset="1" stop-color="#e08a1e"/>
    </linearGradient>
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="0" y2="128">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="16.5" y="16.5" width="223" height="223" rx="56"/>
    </clipPath>
  </defs>
  <!-- Charcoal squircle tile, lit faintly from the top -->
  <rect x="16.5" y="16.5" width="223" height="223" rx="56" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="16.5" y="16.5" width="223" height="223" fill="url(#sheen)"/>
  </g>
  <!-- Hairline rim -->
  <rect x="16.5" y="16.5" width="223" height="223" rx="56" fill="none" stroke="#ffffff" stroke-opacity="0.11" stroke-width="2"/>
  <!-- Play triangle, gold deepening into amber -->
  <path d="M72 64 L184 128 L72 192 Z" fill="url(#brand)" stroke="url(#brand)" stroke-width="16" stroke-linejoin="round"/>
  <!-- Geometric "T" cut out of the triangle -->
  <g fill="url(#bg)">
    <rect x="81" y="100" width="60" height="18" rx="3"/>
    <rect x="102" y="108" width="18" height="56" rx="3"/>
  </g>
  <!-- Sound waves from the tip -->
  <g fill="none" stroke="#f5b83d" stroke-width="9" stroke-linecap="round">
    <path d="M200.49 111.99 A26 26 0 0 1 200.49 144.01"/>
    <path d="M213.10 102.14 A42 42 0 0 1 213.10 153.86" stroke-opacity="0.45"/>
  </g>
</svg>
